<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>For you</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #fbf6ec;
      --paper-dark: #e9dcc6;
      --ink: #2b1a17;
      --wax: #a3122b;
      --photo-w: clamp(100px, 17vw, 230px);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    [hidden] { display: none !important; } /* .envelope sets display, which would beat the attribute */
    body {
      position: relative; /* frames are scattered down the whole document */
      z-index: 0; /* own stacking context; without it Safari drops the body gradient behind the fixed ::before */
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 6vh 4vw;
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      background: radial-gradient(ellipse at 50% 115%, #5a1220 0%, #24070c 45%, #0b0304 100%);
      overflow-x: hidden;
    }
    /* slow drifting glow behind everything */
    body::before {
      content: "";
      position: fixed;
      inset: -20%;
      z-index: -1;
      background:
        radial-gradient(circle at 30% 30%, rgba(190, 40, 70, .28), transparent 40%),
        radial-gradient(circle at 70% 70%, rgba(120, 20, 40, .35), transparent 45%);
      animation: drift 40s ease-in-out infinite alternate;
    }
    @keyframes drift {
      from { transform: translate(-3%, -2%) rotate(0deg); }
      to   { transform: translate(3%, 2%) rotate(6deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      body::before { animation: none; }
      * { transition: none !important; }
    }

    /* envelope */
    .envelope {
      all: unset;
      cursor: pointer;
      position: relative;
      width: min(86vw, 440px);
      aspect-ratio: 1.55;
      background: var(--paper);
      border-radius: 8px;
      box-shadow: 0 30px 70px rgba(0, 0, 0, .65), 0 2px 6px rgba(0,0,0,.4);
      display: grid;
      place-items: center;
      perspective: 800px;
      transition: transform .65s cubic-bezier(.2,.7,.2,1), opacity .65s ease;
    }
    .envelope:focus-visible { outline: 3px solid #fff; outline-offset: 6px; }
    .envelope:hover { transform: translateY(-4px) rotate(-.5deg); }
    .envelope::before {
      /* flap */
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 56%;
      background: var(--paper-dark);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      border-radius: 8px 8px 0 0;
      transform-origin: 50% 0;
      transition: transform .8s cubic-bezier(.45, 0, .2, 1), background-color .8s ease;
    }
    .envelope::after {
      /* bottom fold lines */
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 8px;
      background:
        linear-gradient(to top left, transparent 49.6%, rgba(0,0,0,.06) 50%, transparent 50.4%) no-repeat,
        linear-gradient(to top right, transparent 49.6%, rgba(0,0,0,.06) 50%, transparent 50.4%) no-repeat;
      pointer-events: none;
    }
    .seal {
      position: relative;
      z-index: 1;
      width: 96px;
      height: 96px;
      display: grid;
      place-items: center;
      color: var(--wax); /* text heart only shows if the SVG seal never gets built */
      font-size: 34px;
      filter: drop-shadow(0 5px 8px rgba(0,0,0,.4));
      transform: translateY(-6%);
      transition: transform .3s ease, opacity .3s ease;
    }
    .seal svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .hint {
      position: absolute;
      bottom: 12%;
      left: 0; right: 0;
      text-align: center;
      font-size: .95rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #6b4b45;
      opacity: .8;
    }
    .envelope.opening {
      transform: translateY(-40px) scale(.92);
      opacity: 0;
      pointer-events: none;
      transition: transform .7s ease .3s, opacity .7s ease .3s;
    }
    .envelope.opening::before {
      transform: rotateX(180deg);
      background: #d6c3a5; /* the inside of the flap, a shade darker */
    }
    .envelope.opening .seal {
      transform: translateY(-6%) scale(0);
      opacity: 0;
    }

    /* letter */
    .letter {
      position: relative;
      width: min(94vw, 960px);
      background: var(--paper);
      padding: clamp(10px, 1.6vw, 18px);
      border-radius: 4px;
      box-shadow: 0 30px 70px rgba(0, 0, 0, .65);
      font-family: "Caveat", "Segoe Print", "Bradley Hand", cursive;
      font-size: clamp(1.4rem, 1.1rem + 1.4vw, 1.95rem);
      line-height: 1.4;
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 1.1s ease .2s, transform 1.1s ease .2s;
    }
    .letter.show { opacity: 1; transform: none; }
    @media (min-width: 1100px) {
      /* fill the gap between the photo columns (innermost anchors sit 11vw from each edge) */
      .letter { width: min(960px, calc(100vw - 2 * (11vw + var(--photo-w) / 2) - 84px)); }
    }
    .letter p { margin: 0 0 1.1em; }
    .letter ul { margin: 0 0 1.1em 1.2em; padding: 0; }
    .letter .sign { margin-top: 1.6em; }
    /* pages exported from Goodnotes go here as images */
    .letter img.page {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 0 .6rem;
      box-shadow: 0 6px 20px rgba(0,0,0,.15);
    }
    .letter img.page:last-child { margin-bottom: 0; }

    /* hearts that fall from the pointer while it moves over the envelope */
    .hearts {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }
    .heart {
      position: absolute;
      width: var(--size);
      height: var(--size);
      margin: calc(var(--size) / -2) 0 0 calc(var(--size) / -2);
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .35));
      will-change: translate, scale, opacity;
      animation:
        heart-fall var(--dur) cubic-bezier(.45, 0, .85, .55) forwards,
        heart-grow var(--dur) ease-out forwards;
    }
    .heart svg { display: block; width: 100%; height: 100%; }
    @keyframes heart-fall {
      from { translate: 0 0; rotate: 0deg; }
      to   { translate: var(--dx) var(--fall); rotate: var(--rot); }
    }
    @keyframes heart-grow {
      0%   { scale: 0; opacity: 0; }
      20%  { scale: 1; opacity: .95; }
      75%  { opacity: .9; }
      100% { scale: .85; opacity: 0; }
    }

    /* photos scattered behind everything; click one to bring it forward */
    .photo {
      --w: var(--photo-w);
      --x: 50%; --y: 50%; --rot: 0deg; /* --y is a share of the whole page, not the screen */
      position: absolute;
      z-index: 0;
      top: var(--y);
      left: var(--x);
      width: var(--w);
      margin: 0;
      padding: calc(var(--w) * .06) calc(var(--w) * .06) calc(var(--w) * .08);
      font-size: calc(var(--w) * .09);
      background: var(--paper);
      box-shadow: 0 12px 30px rgba(0, 0, 0, .5);
      transform: translate(-50%, -50%) rotate(var(--rot));
      filter: brightness(.82);
      cursor: pointer;
      visibility: hidden;
      opacity: 0;
      transition:
        width .45s cubic-bezier(.2,.7,.2,1), padding .45s cubic-bezier(.2,.7,.2,1), font-size .45s cubic-bezier(.2,.7,.2,1),
        top .45s cubic-bezier(.2,.7,.2,1), left .45s cubic-bezier(.2,.7,.2,1), transform .45s cubic-bezier(.2,.7,.2,1),
        filter .3s ease, box-shadow .3s ease,
        z-index .45s step-end, /* stay on top while animating back */
        opacity .9s ease var(--delay, 0s), visibility 0s linear var(--delay, 0s);
    }
    body.opened .photo { visibility: visible; opacity: 1; }
    body.lightbox { overflow: hidden; } /* no scrolling while a photo is up */
    .photo:not(.front):hover {
      transform: translate(-50%, -50%) rotate(var(--rot)) scale(1.05);
      filter: none;
    }
    .photo img, .photo video {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 4; /* phone media is portrait */
      object-fit: cover;
      background: #bfae9e;
    }
    .photo figcaption {
      font-family: "Caveat", "Segoe Print", "Bradley Hand", cursive;
      font-size: 1em;
      line-height: 1;
      text-align: center;
      color: #5a4640;
      margin-top: .45em;
    }
    .photo.front {
      --w: min(78vw, 480px, 58vh); /* portrait frame is ~1.5x its width tall */
      top: var(--fy, 50%); /* centre of the current screen, set by the script */
      left: var(--fx, 50%);
      transform: translate(-50%, -50%) rotate(0deg);
      z-index: 5;
      filter: none;
      cursor: default;
      box-shadow: 0 30px 80px rgba(0, 0, 0, .7);
      transition:
        width .45s cubic-bezier(.2,.7,.2,1), padding .45s cubic-bezier(.2,.7,.2,1), font-size .45s cubic-bezier(.2,.7,.2,1),
        top .45s cubic-bezier(.2,.7,.2,1), left .45s cubic-bezier(.2,.7,.2,1), transform .45s cubic-bezier(.2,.7,.2,1),
        filter .3s ease, box-shadow .3s ease,
        z-index 0s;
    }
    .photo .close {
      display: none;
      position: absolute;
      top: -12px;
      right: -12px;
      width: 30px;
      height: 30px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: #1a0508;
      color: #f3e9dc;
      font: 18px/30px Georgia, serif;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .5);
    }
    .photo .close:hover { background: var(--wax); }
    .photo.front .close { display: block; }
    .backdrop {
      position: fixed;
      inset: 0;
      z-index: 4;
      background: rgba(10, 3, 4, .6);
      opacity: 0;
      pointer-events: none;
      transition: opacity .35s ease;
    }
    .backdrop.show { opacity: 1; pointer-events: auto; }

    /* player: volume + pause, bottom right */
    .player {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 4px 4px 14px;
      border: 1px solid rgba(255,255,255,.25);
      background: rgba(0,0,0,.45);
      color: #f3e9dc;
      border-radius: 999px;
      backdrop-filter: blur(6px);
    }
    .vol {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-right: 10px;
      border-right: 1px solid rgba(255,255,255,.2);
    }
    .vol svg { display: block; opacity: .8; }
    .volume {
      --v: 1; /* 0..1, set from the slider so the track fills up to the thumb */
      -webkit-appearance: none;
      appearance: none;
      width: 84px;
      height: 4px;
      margin: 0;
      border-radius: 2px;
      background: linear-gradient(to right, #f3e9dc calc(var(--v) * 100%), rgba(255,255,255,.3) 0);
      cursor: pointer;
    }
    .volume:focus-visible { outline: 2px solid #fff; outline-offset: 6px; }
    .volume::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #f3e9dc;
      box-shadow: 0 1px 3px rgba(0,0,0,.45);
    }
    .volume::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border: 0;
      border-radius: 50%;
      background: #f3e9dc;
      box-shadow: 0 1px 3px rgba(0,0,0,.45);
    }
    .volume::-moz-range-track { background: transparent; }
    .music {
      border: 0;
      background: none;
      color: inherit;
      font: inherit;
      font-size: .9rem;
      padding: .4em .8em;
      border-radius: 999px;
      cursor: pointer;
    }
    .music:hover { background: rgba(255,255,255,.1); }
  </style>
</head>
<body>

  <script>
    (function () {
      // ---- tunables ----
      var HEARTS_PER_SECOND = 10;  // spawn rate while the pointer moves over the envelope
      var MAX_HEARTS = 60;         // cap on hearts alive at once

      var hearts = document.getElementById('hearts');
      var env = document.getElementById('envelope');
      var letter = document.getElementById('letter');
      var song = document.getElementById('song');
      var ctl = document.getElementById('music');
      var player = document.getElementById('player');
      var vol = document.getElementById('volume');
      var opened = false;
      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // ---- hearts ----
      var HEART_PATH = 'M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z';

      // Scalloped wax silhouette in a -50..50 viewBox: five uneven lobes, a gravity
      // bias so the blob looks settled, cosine bells so valleys blend. Random per load.
      function buildWaxPath() {
        var LOBES = 5, OUTER_BASE = 40, VALLEY_BASE = 29;
        var biasAngle = Math.random() * Math.PI * 2;
        var BIAS_STRENGTH = 2 + Math.random() * 2.5;
        var PEAK_JITTER = 2.2, VALLEY_JITTER = 1.3, TIP_SHARPNESS = 1.15;

        var weights = [], wSum = 0, i;
        for (i = 0; i < LOBES; i++) {
          var w = 0.35 + Math.pow(Math.random(), 0.8) * 1.3;
          weights.push(w); wSum += w;
        }
        var lobes = [], cursor = Math.random() * Math.PI * 2;
        for (i = 0; i < LOBES; i++) {
          var arc = (weights[i] / wSum) * Math.PI * 2;
          var angle = cursor + arc / 2;
          var bias = Math.cos(angle - biasAngle);
          lobes.push({
            angle: angle,
            peakR: OUTER_BASE + bias * BIAS_STRENGTH + (Math.random() - 0.5) * PEAK_JITTER * 2,
            valleyR: VALLEY_BASE + bias * BIAS_STRENGTH * 0.4 + (Math.random() - 0.5) * VALLEY_JITTER * 2,
            halfWidth: 0
          });
          cursor += arc;
        }
        for (i = 0; i < LOBES; i++) {
          var gapPrev = lobes[i].angle - lobes[(i - 1 + LOBES) % LOBES].angle;
          var gapNext = lobes[(i + 1) % LOBES].angle - lobes[i].angle;
          if (gapPrev <= 0) gapPrev += Math.PI * 2;
          if (gapNext <= 0) gapNext += Math.PI * 2;
          lobes[i].halfWidth = ((gapPrev + gapNext) / 2) * 0.85;
        }
        function bell(delta, halfWidth) {
          while (delta > Math.PI) delta -= Math.PI * 2;
          while (delta < -Math.PI) delta += Math.PI * 2;
          var u = delta / halfWidth;
          if (u <= -1 || u >= 1) return 0;
          return Math.pow(0.5 + 0.5 * Math.cos(u * Math.PI), TIP_SHARPNESS);
        }

        var SAMPLES = LOBES * 36, pts = [], s;
        for (s = 0; s < SAMPLES; s++) {
          var a = (s / SAMPLES) * Math.PI * 2;
          var valleyField = 0, lobeField = 0, weightSum = 0;
          for (i = 0; i < LOBES; i++) {
            var b = bell(a - lobes[i].angle, lobes[i].halfWidth);
            if (b <= 0) continue;
            lobeField += (lobes[i].peakR - VALLEY_BASE) * b;
            valleyField += lobes[i].valleyR * b;
            weightSum += b;
          }
          var r = (weightSum > 0 ? valleyField / weightSum : VALLEY_BASE) + lobeField;
          pts.push([Math.cos(a) * r, Math.sin(a) * r]);
        }

        // Catmull-Rom through the samples, emitted as cubics
        var n = pts.length;
        function get(k) { return pts[((k % n) + n) % n]; }
        var d = 'M ' + pts[0][0].toFixed(2) + ' ' + pts[0][1].toFixed(2) + ' ';
        for (i = 0; i < n; i++) {
          var p0 = get(i - 1), p1 = get(i), p2 = get(i + 1), p3 = get(i + 2);
          d += 'C ' + (p1[0] + (p2[0] - p0[0]) / 6).toFixed(2) + ' ' + (p1[1] + (p2[1] - p0[1]) / 6).toFixed(2) +
               ', ' + (p2[0] - (p3[0] - p1[0]) / 6).toFixed(2) + ' ' + (p2[1] - (p3[1] - p1[1]) / 6).toFixed(2) +
               ', ' + p2[0].toFixed(2) + ' ' + p2[1].toFixed(2) + ' ';
        }
        return d + 'Z';
      }

      // Wax seal: scalloped blob, a darker pressed disc, and the heart as an impression
      // (shadowed wall top-left, lit wall bottom-right). Page colours throughout.
      function buildSeal() {
        var seal = document.querySelector('.seal');
        if (!seal) return;
        var heart = function (cls, dx, dy, fill, opacity) {
          return '<path class="' + cls + '" d="' + HEART_PATH + '" transform="translate(' + dx + ' ' + dy + ')" fill="' + fill + '"' +
                 (opacity ? ' fill-opacity="' + opacity + '"' : '') + '/>';
        };
        seal.innerHTML =
          '<svg viewBox="-50 -50 100 100" aria-hidden="true">' +
            '<defs>' +
              '<radialGradient id="wax-g" cx="35%" cy="30%" r="95%">' +
                '<stop offset="0" stop-color="#d4304a"/><stop offset=".6" stop-color="#a3122b"/><stop offset="1" stop-color="#6e0a1c"/>' +
              '</radialGradient>' +
              '<linearGradient id="lip-g" x1="0" y1="0" x2="0" y2="1">' +
                '<stop offset="0" stop-color="#000" stop-opacity=".4"/><stop offset=".5" stop-color="#000" stop-opacity="0"/>' +
                '<stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".28"/>' +
              '</linearGradient>' +
            '</defs>' +
            '<path class="wax" d="' + buildWaxPath() + '" fill="url(#wax-g)" stroke="#6e0a1c" stroke-opacity=".5" stroke-width=".8"/>' +
            '<circle class="press" r="28.5" fill="#8e0f26"/>' +
            '<circle r="27.4" fill="none" stroke="url(#lip-g)" stroke-width="2.2"/>' +
            '<g transform="translate(-16.8 -17.1) scale(1.4)">' +
              heart('heart-lip', 0.9, 0.9, '#f2b4be', '.5') +
              heart('heart-wall', -0.7, -0.7, '#4a0512') +
              heart('heart', 0, 0, '#7a0b1e') +
            '</g>' +
          '</svg>';
      }
      buildSeal();
      var lastSpawn = 0;

      function rand(a, b) { return a + Math.random() * (b - a); }

      function spawnHeart(e) {
        if (opened || reduceMotion) return;
        var now = performance.now();
        if (now - lastSpawn < 1000 / HEARTS_PER_SECOND) return;
        if (hearts.childElementCount >= MAX_HEARTS) return;
        lastSpawn = now;

        var h = document.createElement('span');
        h.className = 'heart';
        h.innerHTML = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="' + HEART_PATH + '"/></svg>';
        h.style.left = e.clientX + 'px';
        h.style.top = e.clientY + 'px';
        h.style.setProperty('--size', rand(10, 26).toFixed(0) + 'px');
        h.style.setProperty('--dx', rand(-40, 40).toFixed(0) + 'px');
        h.style.setProperty('--fall', rand(120, 260).toFixed(0) + 'px');
        h.style.setProperty('--rot', rand(-40, 40).toFixed(0) + 'deg');
        h.style.setProperty('--dur', rand(1.2, 2.2).toFixed(2) + 's');
        // wine through bright red, same family as the background and the wax seal
        h.style.color = 'hsl(' + rand(340, 358).toFixed(0) + ' ' + rand(60, 85).toFixed(0) + '% ' + rand(28, 58).toFixed(0) + '%)';
        h.addEventListener('animationend', function () { h.remove(); });
        hearts.appendChild(h);
      }
      env.addEventListener('pointermove', spawnHeart);

      function setLabel() {
        var playing = !song.paused;
        ctl.textContent = '♫ ' + (playing ? 'pause' : 'play');
        ctl.setAttribute('aria-pressed', String(playing));
      }

      function reveal() {
        env.hidden = true;
        document.body.classList.add('opened'); // photos fade in with the letter
        letter.hidden = false;
        void letter.offsetWidth; // force a reflow so the fade-in transition runs
        letter.classList.add('show');
      }

      env.addEventListener('click', function () {
        if (opened) return;
        opened = true;
        env.classList.add('opening');

        // play() must be called inside the tap handler or browsers block it
        [].forEach.call(document.querySelectorAll('.photo video'), function (v) {
          var q = v.play(); if (q && q.catch) q.catch(function () {}); // poster stays if it can't
        });
        var p = song.play();
        if (p && p.then) {
          p.then(function () { player.hidden = false; setLabel(); })
           .catch(function () { player.hidden = true; }); // no file yet, or blocked
        }
        setTimeout(reveal, 1000);
      });

      // ---- volume ----
      function setVolume() {
        song.volume = +vol.value;
        vol.style.setProperty('--v', vol.value);
      }
      vol.addEventListener('input', setVolume);
      // iOS Safari ignores audio.volume (always 1), so hide a slider that can't do anything
      song.volume = 0.5;
      if (song.volume !== 0.5) document.getElementById('vol').hidden = true;
      setVolume();

      // ---- photos ----
      var backdrop = document.getElementById('backdrop');
      var frontPhoto = null;

      function bringToFront(ph) {
        if (!document.body.classList.contains('opened')) return; // photos only exist once the letter is out
        if (frontPhoto) frontPhoto.classList.remove('front');
        frontPhoto = ph;
        // frames are absolute, so the "centre of the screen" is the scroll position plus half the viewport
        ph.style.setProperty('--fx', (window.scrollX + window.innerWidth / 2) + 'px');
        ph.style.setProperty('--fy', (window.scrollY + window.innerHeight / 2) + 'px');
        ph.classList.add('front');
        backdrop.classList.add('show');
        document.body.classList.add('lightbox');
      }
      function sendBack() {
        if (!frontPhoto) return;
        frontPhoto.classList.remove('front');
        frontPhoto = null;
        backdrop.classList.remove('show');
        document.body.classList.remove('lightbox');
      }
      [].forEach.call(document.querySelectorAll('.photo'), function (ph) {
        ph.addEventListener('click', function (e) {
          if (e.target.closest('.close')) { sendBack(); return; }
          if (frontPhoto !== ph) bringToFront(ph);
        });
        ph.addEventListener('keydown', function (e) {
          if (e.key !== 'Enter' && e.key !== ' ') return;
          e.preventDefault();
          if (frontPhoto === ph) sendBack(); else bringToFront(ph);
        });
      });
      backdrop.addEventListener('click', sendBack);
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') sendBack(); });

      ctl.addEventListener('click', function () {
        if (song.paused) { song.play(); } else { song.pause(); }
        setLabel();
      });
      song.addEventListener('play', setLabel);
      song.addEventListener('pause', setLabel);
    })();
  </script>
</body>
</html>
